<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Anand Pratap - Forward Deployed Engineer, Enterprise Data and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.55" stop-color="#10264a"/>
      <stop offset="1" stop-color="#0f3b5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- data-flow network, right side -->
  <g stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M760 70 L860 130 L960 80 L1060 150 L1130 90"/>
    <path d="M860 130 L900 230 L1010 210 L1060 150"/>
    <path d="M760 70 L800 200 L900 230"/>
    <path d="M960 80 L1010 210"/>
    <path d="M1060 150 L1150 235"/>
    <path d="M800 200 L860 130"/>
  </g>
  <g fill="#0b1426" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="760" cy="70" r="9"/>
    <circle cx="860" cy="130" r="12"/>
    <circle cx="960" cy="80" r="9"/>
    <circle cx="1060" cy="150" r="13"/>
    <circle cx="1130" cy="90" r="8"/>
    <circle cx="800" cy="200" r="8"/>
    <circle cx="900" cy="230" r="10"/>
    <circle cx="1010" cy="210" r="9"/>
    <circle cx="1150" cy="235" r="7"/>
  </g>
  <g fill="#34d399">
    <circle cx="860" cy="130" r="4"/>
    <circle cx="1060" cy="150" r="4.5"/>
    <circle cx="900" cy="230" r="3.5"/>
  </g>

  <!-- text -->
  <text x="60" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Anand Pratap</text>
  <rect x="62" y="140" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">Forward Deployed Engineer</text>
  <text x="60" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Enterprise Data &amp; AI  ·  Cloud-native platforms  ·  Agentic AI</text>
</svg>
